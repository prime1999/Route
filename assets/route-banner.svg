<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">ROUTE</title>
  <desc id="desc">Open infrastructure for AI-powered opportunity workflows</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#16206b"/>
      <stop offset="1" stop-color="#4b2fa8"/>
    </linearGradient>

    <radialGradient id="core" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8b9cff"/>
    </radialGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#dots)"/>

  <!-- Wordmark -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="62" y="134" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="8">ROUTE</text>
    <text x="66" y="182" font-size="22" fill="#c7d2fe">Open infrastructure for AI-powered</text>
    <text x="66" y="212" font-size="22" fill="#c7d2fe">opportunity workflows</text>
    <text x="66" y="262" font-size="14" fill="#94a3b8" letter-spacing="2">MCP SERVER  ·  JOBS  ·  HACKATHONS  ·  AGENT-AGNOSTIC</text>
  </g>

  <!-- Sources flow into ROUTE, and out to agents -->
  <g fill="none" stroke="#a5b4fc" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <path d="M726 70 C 820 70, 830 150, 902 150"/>
    <path d="M726 150 L 902 150"/>
    <path d="M726 230 C 820 230, 830 150, 902 150"/>

    <path d="M958 150 C 1030 150, 1040 70, 1134 70"/>
    <path d="M958 150 L 1134 150"/>
    <path d="M958 150 C 1030 150, 1040 230, 1134 230"/>
  </g>

  <!-- Centre: the ROUTE server -->
  <circle cx="930" cy="150" r="44" fill="#818cf8" opacity="0.8" filter="url(#glow)"/>
  <circle cx="930" cy="150" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="930" cy="150" r="28" fill="url(#core)"/>
  <text x="930" y="160" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#1e1b4b">R</text>

  <!-- Sources -->
  <g fill="#7dd3fc">
    <circle cx="718" cy="70" r="9"/>
    <circle cx="718" cy="150" r="9"/>
    <circle cx="718" cy="230" r="9"/>
  </g>

  <!-- Agents -->
  <g fill="#c4b5fd">
    <circle cx="1142" cy="70" r="9"/>
    <circle cx="1142" cy="150" r="9"/>
    <circle cx="1142" cy="230" r="9"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="2" text-anchor="middle">
    <text x="718" y="282">SOURCES</text>
    <text x="930" y="224">MCP</text>
    <text x="1142" y="282">AGENTS</text>
  </g>
</svg>